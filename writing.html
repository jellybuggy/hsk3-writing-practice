<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSK3 书写部分总练习</title>
  <link rel="stylesheet" href="writing-style.css">
</head>
<body>
  <div class="container">
    <!-- Home View -->
    <div id="homeView">
      <div class="header">
        <h1>HSK3 书写部分总练习</h1>
        <p>Part 1 词语排序 | Part 2 拼音写汉字</p>
      </div>
      <div class="day-grid">
        <button class="day-btn" data-day="1">Day 1</button>
        <button class="day-btn" data-day="2">Day 2</button>
        <button class="day-btn" data-day="3">Day 3</button>
        <button class="day-btn" data-day="4">Day 4</button>
        <button class="day-btn" data-day="5">Day 5</button>
        <button class="day-btn" data-day="6">Day 6</button>
        <button class="day-btn" data-day="7">Day 7</button>
      </div>
    </div>

    <!-- Practice View -->
    <div id="practiceView" class="hidden">
      <!-- Module Switch -->
      <div class="module-switch">
        <button class="module-btn active" id="part1Btn">Part 1 词语排序</button>
        <button class="module-btn" id="part2Btn">Part 2 拼音写汉字</button>
      </div>

      <div class="practice-header">
        <button class="back-btn" id="backToDayBtn">返回</button>
        <span class="progress" id="progressText">1 / 23</span>
      </div>

      <!-- Part1 Practice Area -->
      <div id="part1Area">
        <div class="question-card">
          <div class="question-number" id="part1QuestionNumber">第 1 题</div>
          <div class="question-title">请将下列词语排列成正确的句子：</div>

          <!-- Available Words -->
          <div class="words-area" id="wordsArea"></div>

          <!-- Answer Area -->
          <div class="answer-area" id="answerArea"></div>

          <!-- Control Buttons -->
          <div class="control-btns">
            <button class="ctrl-btn undo" id="undoBtn">撤回</button>
            <button class="ctrl-btn clear" id="clearBtn">清空</button>
            <button class="ctrl-btn check" id="checkBtn">检查答案</button>
            <button class="ctrl-btn next" id="nextBtn">下一题</button>
          </div>

          <!-- Result Area -->
          <div id="resultArea"></div>
        </div>
      </div>

      <!-- Part2 Practice Area -->
      <div id="part2Area" class="hidden">
        <div class="question-card">
          <div class="question-number" id="part2QuestionNumber">第 1 题</div>
          <div class="question-sentence" id="part2QuestionSentence"></div>

          <div class="input-area">
            <input type="text" class="answer-input" id="part2AnswerInput" placeholder="请输入汉字" maxlength="10" autocomplete="off" autocorrect="off" autocapitalize="off">
            <button class="ctrl-btn check" id="part2CheckBtn">检查</button>
          </div>

          <div id="part2ResultArea"></div>
        </div>
        <button class="ctrl-btn next" id="part2NextBtn" style="width:100%; margin-top:0;" disabled>下一题</button>
      </div>

      <button class="back-btn" id="backHomeBtn" style="display:block; margin:12px auto 0; text-align:center;">返回首页</button>
    </div>

    <!-- Score View -->
    <div id="scoreView" class="hidden">
      <div class="score-card">
        <div class="score-title" id="scoreTitle">Day 1 练习完成！</div>
        <div class="score-number" id="scoreNumber">18/23</div>
        <div class="score-detail" id="scoreDetail">正确率 78.3%</div>
        <button class="restart-btn" id="restartBtn">重新练习</button>
        <a href="#" class="home-link" id="homeBtn">返回首页</a>
      </div>
    </div>
  </div>

  <script src="hsk3-writing-part1-sentence-questions.js"></script>
  <script src="questions.js"></script>
  <script src="writing-app.js"></script>
</body>
</html>
